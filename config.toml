# 財務エントリ（会計伝票・月次入力）自動入力の設定
#
# このファイルを書き換えると、コードを変えずにキー操作の順番を変えられます。
# 文字の前の「#」はコメントで、動作には影響しません。

# ─────────────────────────────────────────────
# 入力先ウィンドウ
# ─────────────────────────────────────────────
[target.zaimu]
# 開始時（PgUp を押したとき）に最前面にあるウィンドウのタイトル。完全一致で判定する。
title = "会計伝票"
# 入力中は「開始時と同じプロセス（財務エントリ）のウィンドウ」が最前面のときだけキーを送る。
# 課税区分一覧・取引先名一覧などの一覧ウィンドウも同じプロセスなので、そのまま許可される。
# さらに厳しくしたい場合は、許可するタイトルをここに並べる（空なら同じプロセスならすべて許可）。
# 例: allowed_titles = ["会計伝票", "課税区分一覧", "取引先名一覧", "元帳摘要一覧"]
allowed_titles = []

# --notepad を付けて実行したときの入力先（練習用）
[target.notepad]
title_contains = "メモ帳"
allowed_titles = []

# ─────────────────────────────────────────────
# 待ち時間（秒）
# ─────────────────────────────────────────────
[timing]
key_interval = 0.2   # キーを1つ送るごとの待ち時間
paste_wait = 0.3     # 貼り付け（Ctrl+V）のあとの待ち時間
row_wait = 0.5       # 1仕訳を入力し終えてから、次の仕訳に入るまでの待ち時間
resume_wait = 0.5    # PgUp で開始・再開してから、最初のキーを送るまでの待ち時間

# ─────────────────────────────────────────────
# 停止・再開のキー
# ─────────────────────────────────────────────
[hotkeys]
pause = "page down"   # PgDn: すぐに一時停止
resume = "page up"    # PgUp: 開始・再開

# ─────────────────────────────────────────────
# キーの送り方
# ─────────────────────────────────────────────
[input]
# "vk"      : 数字などを、人がキーボードを押したときと同じ形で送る（おすすめ）
# "unicode" : 文字を直接送る（IME を通らないが、アプリによっては受け付けない）
char_mode = "vk"
# true にすると、type（数字などの入力）の直前に IME をオフにする。
# 摘要の入力後に IME がオンのまま残り、次の行の数字が全角になってしまう場合に使う。
ime_off_before_type = false

# ─────────────────────────────────────────────
# CSV
# ─────────────────────────────────────────────
[csv]
encoding = "auto"        # "auto"（UTF-8 → Shift_JIS の順に試す）/ "utf-8-sig" / "cp932"
date_column = "日付"     # 2026/01/05 のような形式
amount_column = "金額"   # カンマ付き（12,000）でもよい

# ─────────────────────────────────────────────
# 入力前のチェック（1件でも引っかかると、キーを1つも送らずに終了する）
# ─────────────────────────────────────────────
[check]
debit_accounts = ["9411", "1113"]    # 借方科目コードとして入力してよいもの
credit_accounts = ["9311", "1113"]   # 貸方科目コードとして入力してよいもの

# 列ごとの最大バイト数（全角1文字＝2バイト、半角1文字＝1バイト）
[check.max_bytes]
# 列名は "" で囲む
"摘要" = 30   # 全角15文字まで

# ─────────────────────────────────────────────
# 1仕訳を入力するときの操作の順番
# ─────────────────────────────────────────────
# 1つの [[steps]] が1つの操作のまとまり。上から順に実行する。
#
#   name   : 表示用の名前
#   type   : キーとして打つ文字（半角英数字のみ）。{列名} で CSV の値を入れられる
#   paste  : クリップボード経由で貼り付ける文字（日本語はこちら）。値が空なら貼り付けない
#   press  : 最後に押すキーの並び。使える名前: ENTER TAB ESC BACKSPACE DELETE SPACE
#            UP DOWN LEFT RIGHT HOME END F1〜F12
#   wait   : この操作のあとに追加で待つ秒数（一覧ウィンドウが開くのを待つときなど）
#   manual : 書くと、そこで一時停止して手作業を待つ（終わったら PgUp で再開）
#   when_not_empty           : この列が空でない行だけ実行する
#   when_column / when_in    : when_column の値が when_in のどれかの行だけ実行する
#
# {列名} には CSV の見出しのほか、次の値も使える。
#   {年} {月} {日}（日付から。先頭の0なし）、{金額}（カンマなどを除いた数字）
#   {消費税}（画面で選んだ "課税" または "免税"）

[[steps]]
name = "税区分"
when_column = "消費税"   # 課税のときだけ（免税の関与先は、借方科目から始まる）
when_in = ["課税"]
type = "0"               # 課税区分一覧で「0」を選ぶ
press = ["ENTER"]
# 業：税区分が「0」なので自動で飛ぶ。何も送らない。

[[steps]]
name = "借方科目"
type = "{借方科目コード}"
press = ["ENTER"]

# 借方補助：CSV の借方補助コードが空でない行だけ、補助科目のウィンドウで補助コードを打って Enter
[[steps]]
name = "借方補助"
when_not_empty = "借方補助コード"
wait = 0.3                 # 補助科目のウィンドウが開くのを待つ
[[steps]]
name = "借方補助"
when_not_empty = "借方補助コード"
type = "{借方補助コード}"
press = ["ENTER"]

[[steps]]
name = "貸方科目"
type = "{貸方科目コード}"
press = ["ENTER"]

# 貸方補助：借方補助と同じ
[[steps]]
name = "貸方補助"
when_not_empty = "貸方補助コード"
wait = 0.3
[[steps]]
name = "貸方補助"
when_not_empty = "貸方補助コード"
type = "{貸方補助コード}"
press = ["ENTER"]

[[steps]]
name = "月日（月次入力のため日のみ）"
type = "{日}"
press = ["ENTER"]

[[steps]]
name = "取引金額"
type = "{金額}"
press = ["ENTER"]

[[steps]]
name = "取引先名一覧 → 直接入力"
type = "0"
wait = 0.3

[[steps]]
name = "取引先名"
paste = "{取引先名}"
press = ["ENTER"]

[[steps]]
name = "元帳摘要一覧を閉じる"
press = ["ENTER"]
wait = 0.3

[[steps]]
name = "元帳摘要"
paste = "{摘要}"
press = ["ENTER"]   # 確定すると次の仕訳の「税区分」へ移る
